apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
  namespace: shopsphere
spec:
  replicas: 1
  selector:
    matchLabels: { app: redisinsight }
  template:
    metadata:
      labels: { app: redisinsight }
    spec:
      containers:
        - name: redisinsight
          image: redis/redisinsight:latest
          ports:
            - containerPort: 5540
---
apiVersion: v1
kind: Service
metadata:
  name: redisinsight
  namespace: shopsphere
spec:
  selector: { app: redisinsight }
  ports:
    - port: 5540
      targetPort: 5540