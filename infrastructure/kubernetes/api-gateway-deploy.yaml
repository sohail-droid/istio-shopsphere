apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: shopsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: imastha8/api-gateway:2.0.1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:8000
            - name: INVENTORY_SERVICE_URL
              value: http://inventory-service:8000
            - name: ORDER_SERVICE_URL
              value: http://order-service:8000
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi