apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: shopsphere
spec:
  # Keep at 1 until payments move from in-memory to a real database.
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: imastha8/payment-service:2.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: PSP_CALLBACK_URL
              value: "http://127.0.0.1:8000/webhooks/psp"
            - name: PSP_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: psp-webhook
                  key: secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
