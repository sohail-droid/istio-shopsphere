# # Example C: Outlier detection
# # Automatically identifies unhealthy service instances and temporarily removes them from load balancing.

apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: product-service
  namespace: shopsphere
spec:
  host: product-service

  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN

    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 100

  subsets:
    - name: v1
      labels:
        version: v1
      trafficPolicy:
        outlierDetection:
          consecutive5xxErrors: 5
          interval: 5s
          baseEjectionTime: 30s
          maxEjectionPercent: 50

    - name: v2
      labels:
        version: v2


