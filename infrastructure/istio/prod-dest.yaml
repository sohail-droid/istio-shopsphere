apiVersion: networking.istio.io/v1
kind: DestinationRule   #how traffic behaves once it gets there (policies and subset definitions).
metadata:
  name: product-service
  namespace: shopsphere
spec:
  host: product-service

  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN   #LEAST_REQUEST, RANDOM, CONSISTENT_HASH

  subsets:
    - name: v1
      labels:
        version: v1

    - name: v2
      labels:
        version: v2


# Example B: Connection pool limits
# This controls how many connections and pending requests Envoy allows towards the destination.
trafficPolicy:
  connectionPool:
    tcp:
      maxConnections: 100
    http:
      http1MaxPendingRequests: 50
      http2MaxRequests: 100
      maxRequestsPerConnection: 10

# Example C: Outlier detection
# Automatically identifying unhealthy endpoints and removing them temporarily from load balancing.
trafficPolicy:
  outlierDetection:
    consecutive5xxErrors: 5
    interval: 10s
    baseEjectionTime: 30s
    maxEjectionPercent: 50


# Pod subsets (v1/v2 labels), load balancing algorithms,
#  mTLS settings, connection pools, circuit breaking